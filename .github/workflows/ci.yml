name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull requests: build the PR head commit itself (not the synthetic merge commit), so the
          # version stamp and the DCO check see the contributor's commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history (with origin/<base>) only for pull requests, where the DCO step needs it.
          # String values: a bare 0 is falsy in expressions and would always fall through to 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./build/check-dco.ps1 -Base "origin/$env:BASE_REF"

      # install.ps1 / uninstall.ps1 under Windows PowerShell 5.1 in ConstrainedLanguage (as under AppLocker),
      # against a scratch HKCU key and a scratch folder.
      - name: Install scripts test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install/install-scripts.Tests.ps1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Modelwright.sln

      - name: Build
        run: dotnet build Modelwright.sln -c Release --no-restore

      - name: Test
        run: dotnet test Modelwright.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: License check
        shell: pwsh
        run: ./build/check-licenses.ps1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error

      - name: Upload packed add-in
        uses: actions/upload-artifact@v7
        with:
          name: Modelwright-xll
          path: src/Modelwright.AddIn/bin/Release/net48/publish/Modelwright64.xll
          if-no-files-found: error
